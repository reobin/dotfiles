set -g mode-style "bg=default,fg=default,reverse"
set -g message-style "fg=#C0CAF5,bg=#24283B"
set -g message-command-style "fg=#C0CAF5,bg=#24283B"
set -g status-style "fg=#C0CAF5,bg=#24283B"
set -g status-left-style "fg=#565F89,bg=#24283B"
set -g status-right "#{?pane_in_mode,#[fg=#24283B#,bg=#E0AF68#,bold] SCROLL #[default],}#{?client_prefix,#[fg=#24283B#,bg=#9ECE6A#,bold] PREFIX #[default],}#{?window_zoomed_flag,#[fg=#24283B#,bg=#7AA2F7#,bold] ZOOM #[default],}#[fg=#565F89] #h "
set -g window-status-style "fg=#565F89,bg=#24283B"
set -g window-status-current-style "fg=#9ECE6A,bg=#24283B"
set -g window-status-activity-style "fg=#24283B,bg=#E0AF68"
set -g window-status-bell-style "fg=#24283B,bg=#F7768E"
set -g pane-border-style "fg=#565F89"
set -g pane-active-border-style "fg=#9ECE6A"
setw -g clock-mode-colour "#9ECE6A"
