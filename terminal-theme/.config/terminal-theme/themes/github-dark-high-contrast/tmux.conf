set -g mode-style "bg=default,fg=default,reverse"
set -g message-style "fg=#F0F3F6,bg=#0A0C10"
set -g message-command-style "fg=#F0F3F6,bg=#0A0C10"
set -g status-style "fg=#F0F3F6,bg=#0A0C10"
set -g status-left-style "fg=#7A828E,bg=#0A0C10"
set -g status-right "#{?pane_in_mode,#[fg=#0A0C10#,bg=#F0B72F#,bold] SCROLL #[default],}#{?client_prefix,#[fg=#0A0C10#,bg=#26CD4D#,bold] PREFIX #[default],}#{?window_zoomed_flag,#[fg=#0A0C10#,bg=#71B7FF#,bold] ZOOM #[default],}#[fg=#7A828E] #h "
set -g window-status-style "fg=#7A828E,bg=#0A0C10"
set -g window-status-current-style "fg=#4AE168,bg=#0A0C10"
set -g window-status-activity-style "fg=#0A0C10,bg=#F0B72F"
set -g window-status-bell-style "fg=#0A0C10,bg=#FF9492"
set -g pane-border-style "fg=#7A828E"
set -g pane-active-border-style "fg=#4AE168"
setw -g clock-mode-colour "#4AE168"
