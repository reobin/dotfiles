set -g status-style "fg=#F8F8F2,bg=#282A36"
set -g status-left-style "fg=#6272A4,bg=#282A36"
set -g status-right "#{?pane_in_mode,#[fg=#282A36#,bg=#F1FA8C#,bold] SCROLL #[default],}#{?client_prefix,#[fg=#282A36#,bg=#50FA7B#,bold] PREFIX #[default],}#{?window_zoomed_flag,#[fg=#282A36#,bg=#BD93F9#,bold] ZOOM #[default],}#[fg=#6272A4] #h "
set -g window-status-style "fg=#6272A4,bg=#282A36"
set -g window-status-current-style "fg=#50FA7B,bg=#282A36"
set -g window-status-activity-style "fg=#282A36,bg=#F1FA8C"
set -g window-status-bell-style "fg=#282A36,bg=#FF5555"
set -g pane-border-style "fg=#6272A4"
set -g pane-active-border-style "fg=#50FA7B"
setw -g clock-mode-colour "#50FA7B"
