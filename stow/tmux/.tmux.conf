# ~/.tmux.conf  (managed by ~/dotfiles, tmux module)
# Minimal setup: sane prefix, mouse, vi keys, true color, subtle status bar.

# --- prefix: C-Space (also send with C-Space C-Space) ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- shell: zsh is the login shell; pin it so panes never depend on the
# server's inherited $SHELL (a server started pre-chsh would spawn bash) ---
set -g default-shell /usr/bin/zsh

# --- essentials ---
set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -s escape-time 10
set -g focus-events on
set -g aggressive-resize on
set -g status-keys emacs  # command prompt; vi copy mode kept above

# --- true color (tmux 3.6) ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- extended keys (Kitty keyboard protocol) ---
# Lets tmux receive/pass e.g. Ctrl+Shift+letter, Ctrl+Enter, etc.
# Requires outer terminal with Kitty-protocol support (kitty, ghostty,
# wezterm, foot, recent VTE/Ptyxis). Graceful fallback otherwise.
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# --- keep new panes/windows in current directory ---
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"  # vim :split -> top/bottom
bind v split-window -h -c "#{pane_current_path}"  # vim :vsplit -> side-by-side

# --- vim pane focus: <prefix> h/j/k/l ---
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# --- kill without confirm ---
bind x kill-pane
bind q kill-window
bind o kill-pane -a  # close all panes except focused

# --- reload: <prefix> r ---
bind r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

# --- visual niceties (subtle, works on light/dark terminals) ---
set -g status-style "fg=white,bg=black"
set -g status-left " #S  "
set -g status-left-length 30
set -g status-right " %H:%M %d-%b "
set -g status-right-length 30
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "fg=black,bg=white,bold"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=white"
set -g message-style "fg=black,bg=white"
setw -g mode-style "fg=black,bg=white,bold"
