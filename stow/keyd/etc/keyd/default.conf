[ids]
*

[main]
# Mac-like: key next to space acts as Cmd (Super), key next to it as Option (Alt).
# i.e. swap Left Alt <-> Left Win. Right Alt stays AltGr (standard).
leftalt = leftmeta
leftmeta = leftalt

# tap caps = esc, hold caps + keys = arrows (+ Ctrl for everything else)
capslock = overload(nav, esc)

[nav:C]
h = left
j = down
k = up
l = right

tab = esc
