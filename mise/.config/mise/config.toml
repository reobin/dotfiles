[settings]
auto_install = true
lockfile = true
legacy_version_file = true
idiomatic_version_file_enable_tools = ["node", "yarn"]
node.corepack = true

[tools]
node = "22"
aws-cli = { version = "latest", symlink_bins = true }
bun = "latest"
claude = "latest"
herdr = "latest"
hunk = "latest"
"github:leohenon/opencode-vim" = { version = "1.18.4-ocv.4.9", matching_regex = "^ocv-", bin = "ocv" }
"npm:ntn" = "latest"
"ubi:k1LoW/git-wt" = "latest"
opencode = "latest"
rust = "latest"
turso = "latest"
typst = "latest"
vercel = "latest"
yarn = "latest"
zig = "latest"
