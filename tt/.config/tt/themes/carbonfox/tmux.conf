set -g mode-style "bg=default,fg=default,reverse"
set -g message-style "fg=#F2F4F8,bg=#161616"
set -g message-command-style "fg=#F2F4F8,bg=#161616"
set -g status-style "fg=#F2F4F8,bg=#161616"
set -g status-left-style "fg=#8D8D8D,bg=#161616"
set -g status-right "#{?pane_in_mode,#[fg=#161616#,bg=#08BDBA#,bold] SCROLL #[default],}#{?client_prefix,#[fg=#161616#,bg=#25BE6A#,bold] PREFIX #[default],}#{?window_zoomed_flag,#[fg=#161616#,bg=#78A9FF#,bold] ZOOM #[default],}#[fg=#8D8D8D] #h "
set -g window-status-style "fg=#8D8D8D,bg=#161616"
set -g window-status-current-style "fg=#42BE65,bg=#161616"
set -g window-status-activity-style "fg=#161616,bg=#08BDBA"
set -g window-status-bell-style "fg=#161616,bg=#EE5396"
set -g pane-border-style "fg=#525252"
set -g pane-active-border-style "fg=#42BE65"
setw -g clock-mode-colour "#25BE6A"
