# wallpaper-color = #1F1F28

# Kanagawa Wave's accents over kanso-zen's ground. Wave carries the chroma kanso
# desaturates away, and zen's #090E13 keeps the contrast Wave gives up to its own
# lighter #1F1F28. The wallpaper color is that #1F1F28, so the ground Wave was
# drawn for sits behind the panes rather than inside them.
#
# The slots do not follow Kanagawa's own terminal mapping one for one, because
# that mapping was drawn for #1F1F28. On a ground this dark its normal red lands
# at 3.8:1 and its bright magenta at 5.9:1, a rounding error above the normal one
# beside it. So each row is raised until every normal slot clears 5.5:1 and every
# bright slot reads above its normal.
#
# palette 10 is the only color here not taken straight from Wave. Wave has no
# green above springGreen, which slot 2 already holds, so this is springGreen at
# 69% lightness with hue and saturation untouched.
palette = 0=#090E13
palette = 1=#E46876
palette = 2=#98BB6C
palette = 3=#C0A36E
palette = 4=#7E9CD8
palette = 5=#957FB8
palette = 6=#7AA89F
palette = 7=#C8C093
palette = 8=#727169
palette = 9=#FF5D62
palette = 10=#B3CD93
palette = 11=#E6C384
palette = 12=#7FB4CA
palette = 13=#B8B4D0
palette = 14=#A3D4D5
palette = 15=#DCD7BA
