# Herdr color overrides for this theme, merged into the generated Herdr config
# by `tt`. See THEME_GUIDE.md.
#
# overlay0 paints inactive pane borders and dimmed hint text, so it is pinned at
# roughly 2.1:1 against this theme's background: recessive next to the accent-lit
# active border, still legible as text.
#
# sidebar_bg stays transparent so the terminal (and its background-opacity) shows
# through instead of painting a solid panel. Herdr reads "transparent" as
# Color::Reset, the same default its built-in terminal theme uses.
#
# active_row_bg paints the active space and focused agent rows. Without it the
# fill falls back to the terminal theme default, which resolves to the same
# pearlGray as the navigate cursor, so focus and cursor read as one fill -
# invisible twice over once the sidebar goes transparent. This is kanso's
# pearlWhite3 at 1.5:1 over the background: pearlWhite2 at 1.2:1 sits too close
# to the cursor to separate from it, so this steps past it to the palette's
# next rung. It stays under the cursor at 1.3:1, so the cursor still reads on
# top, and the neutral paper gray keeps the row quiet.
#
# selection_bg paints the navigate cursor, which has to stay apart from the fill
# on the active space and agent rows. This theme's terminal selection color is
# already a highlight that reads without shouting, so the cursor takes it instead
# of a color belonging to no palette.
#
# yellow is the busy color, on Herdr's own state dot and on the agent rows `tt`
# builds under it. The ANSI yellow this theme would otherwise resolve to is the
# saturated olive, #656720, and its green is #5A6F3F: 24 degrees of hue apart,
# so a working row and a done row read as the same color.
#
# This is pearlYellow3, #DE9800, held at its own hue and saturation and taken
# down to 34% lightness. The palette's gold is the right hue and cannot be used
# as it ships: at 44% lightness it sits at 2.1:1 on this background and reads
# washed out, and every yellow that holds contrast here is an olive or a brown,
# because on paper a yellow has to be light to stay yellow. Darkening is the one
# axis that buys contrast without walking the hue toward orange, and it is the
# same move kanso makes for its own saturated variants.
#
# subtext0 and overlay1 are the second and third text tiers: inactive
# workspace and agent names read subtext0, dialog and onboarding hints read
# overlay1. Neither is a state color. They are pinned because the terminal
# palette answers with ANSI gray and white, both of which vanish on paper.
# subtext0 is pearlGray3 at 4.6:1 here against the foreground's 13.5:1, and
# overlay1 is pearlGray3 lifted 10% in lightness to #878782 at 3.2:1, so the
# two tiers read apart instead of as one gray. pearlGray4 would be the next
# palette rung but lands at 2.4:1, a hair above the inactive-border tone.
[theme.custom]
overlay0 = "#ADA79B"
sidebar_bg = "transparent"
active_row_bg = "#CACAC7"
selection_bg = "#E2E1DF"
yellow = "#AD7700"
subtext0 = "#6D6D69"
overlay1 = "#878782"
