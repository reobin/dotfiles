# prefix is ctrl+space. alt bindings need no prefix.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# fast esc for alt bindings, true color, kitty keyboard for c-space and alt+shift.
set -s escape-time 10
set -s extended-keys on
set -s focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm*:extkeys"
set -as terminal-features "ghostty*:extkeys"
set -as terminal-overrides "xterm*:Tc"
set -as terminal-overrides "ghostty*:Tc"
setw -g xterm-keys on
set -g allow-passthrough on
set -g set-clipboard on

# behavior: new splits follow the focused pane, closes never confirm.
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g mode-keys vi

# --- prefix bindings ---

bind ? list-keys
bind S new-window -n config "$EDITOR ~/.config/tmux/tmux.conf"
bind d detach-client
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"
bind e run-shell "~/.config/tmux/edit-scrollback.sh '#{pane_id}'"

bind w choose-tree -sZ
bind C command-prompt -p "new session:" "new-session -s '%%' -c '#{pane_current_path}'"
bind W command-prompt -I "#S" "rename-session '%%'"
bind Q kill-session

bind c new-window -c "#{pane_current_path}"
bind T command-prompt -I "#W" "rename-window '%%'"
bind q kill-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind f resize-pane -Z

bind r switch-client -T resize
bind -r -T resize h resize-pane -L 5
bind -r -T resize j resize-pane -D 5
bind -r -T resize k resize-pane -U 5
bind -r -T resize l resize-pane -R 5
bind -T resize Enter switch-client -T root
bind -T resize Escape switch-client -T root
bind -T resize q switch-client -T root

bind t run-shell "~/.config/tmux/toggle-split.sh '#{pane_id}'"
bind o kill-pane -a
bind p display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "$SHELL"

# --- alt bindings, no prefix ---

# sessions: alt+j next, alt+k previous.
bind -n M-j switch-client -n
bind -n M-k switch-client -p
# windows: alt+l next, alt+h previous, alt+1..9 jump.
bind -n M-l next-window
bind -n M-h previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
# move window: alt+shift+h left, alt+shift+l right.
bind -n M-H swap-window -t -1 \; select-window -t -1
bind -n M-L swap-window -t +1 \; select-window -t +1

# no equivalent: sessions have no manual order and there is no agent queue.
# loud stubs so the keys fail visibly.
bind -n M-K display-message "tmux sessions have no manual order"
bind -n M-J display-message "tmux sessions have no manual order"
bind -n M-n display-message "no agent queue in tmux"
bind -n M-s display-message "no sidetrack in tmux"

# --- status bar and clipboard ---

set -g status on
set -g status-position bottom
set -g status-style "fg=default,bg=default"
set -g status-left " #S "
set -g status-left-length 30
set -g status-right ""
setw -g window-status-current-style "bold"
setw -g window-status-current-format "#I:#W"
setw -g window-status-format "#I:#W"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
