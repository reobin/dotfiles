id = "reobin.space-tokens"
name = "Space tokens"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Report one sidebar line per agent on each space"
platforms = ["linux", "macos"]

# refresh.sh takes no arguments and recomputes every space, so events that always
# fire beside one already listed here are left out. tab.closed stays: it has been
# seen firing with no pane.closed beside it.
#
# pane.updated, the only event carrying a title or cwd change, is published on the
# socket API but rejected at plugin link time, so a cd arrives from the chpwd hook
# in zsh/.config/zsh/herdr.zsh instead.
[[startup]]
command = ["sh", "refresh.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "refresh.sh"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "refresh.sh"]

[[events]]
on = "pane.created"
command = ["sh", "refresh.sh"]

[[events]]
on = "pane.closed"
command = ["sh", "refresh.sh"]

[[events]]
on = "pane.moved"
command = ["sh", "refresh.sh"]

[[events]]
on = "pane.exited"
command = ["sh", "refresh.sh"]

[[events]]
on = "tab.closed"
command = ["sh", "refresh.sh"]

[[events]]
on = "tab.renamed"
command = ["sh", "refresh.sh"]

[[events]]
on = "tab.moved"
command = ["sh", "refresh.sh"]

[[events]]
on = "workspace.renamed"
command = ["sh", "refresh.sh"]

[[events]]
on = "worktree.opened"
command = ["sh", "refresh.sh"]

[[events]]
on = "worktree.removed"
command = ["sh", "refresh.sh"]
