onboarding = false

[theme]
name = "terminal"

# This file is the base. tt concatenates it with tt/themes/<name>/herdr.toml
# to produce config.toml, which is what Herdr actually reads, so edit this file
# and not that one. The theme fragment owns `[theme.custom]`: overlay0 paints
# inactive pane borders and dimmed hint text, and no single gray is recessive
# on both paper and ink backgrounds.

[terminal]
new_cwd = "follow"

[update]
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+space"

help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
open_notification_target = ""
edit_scrollback = "prefix+e"

workspace_picker = "prefix+w"
previous_workspace = "alt+k"
next_workspace = "alt+j"
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+q"

new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "alt+h"
next_tab = "alt+l"

move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+l"

switch_tab = "alt+1..9"
close_tab = "prefix+q"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+f"
resize_mode = "prefix+r"

resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = "$HOME/.local/bin/herdr-move-workspace up"
description = "move workspace up"

[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = "$HOME/.local/bin/herdr-move-workspace down"
description = "move workspace down"

[[keys.command]]
key = "alt+n"
type = "plugin_action"
command = "to4iki.unread-jump.next"
description = "focus next agent waiting"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "$HOME/.local/bin/herdr-toggle-split"
description = "toggle split direction"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "reobin.close-other-panes.close-others"

[[keys.command]]
key = "alt+s"
type = "shell"
command = "$HOME/.local/bin/herdr-sidetrack"
description = "sidetrack this conversation"

# A pane garbled by a fullscreen toggle survives claude's own repaints, /resume
# and ctrl+l alike, so clearing it takes a new process.
[[keys.command]]
key = "alt+c"
type = "shell"
command = "$HOME/.local/bin/herdr-restart-agent"
description = "restart claude on the same session"

# hunkdiff's own `setup-keys` writes into config.toml, which tt regenerates
# from this file, so its bindings live here instead.
[[keys.command]]
key = "alt+r"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "review agent changes"

[[keys.command]]
key = "alt+shift+r"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "send review to agent"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:branch"
description = "review this branch against its base"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "$SHELL"
width = "80%"
height = "80%"
description = "floating pane"

[ui]
mouse_capture = true

# A wheel notch is the only scroll Herdr sizes from config; page keys are always
# a full page. The karabiner rule behind alt+u sends notches, so this number is
# what makes that chord land on roughly half a screen. It costs the trackpad,
# which now moves 8 lines a notch, and that trade is the point.
mouse_scroll_lines = 8
confirm_close = false
prompt_new_tab_name = false

# Both prompts land before there is anything to name, so what gets typed is a
# placeholder. The title row says which repo and the branch row which checkout,
# and two spaces on one checkout are told apart by the pane lines under them
# rather than by a number. A space that earns a name gets one later, from
# rename_workspace.
prompt_new_workspace_name = false

# Agent and command lines need the room; 36 is also the default max width.
sidebar_width = 36

pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true

pane_scrollbars = false

hide_tab_bar_when_single_tab = true

agent_panel_sort = "spaces"

# The symbols set marks working with U+25D0, which JetBrains Mono lacks; it comes
# from Menlo instead and draws a size larger than every glyph beside it. Dots stay
# in the one font and carry state in hue alone, which the rows below already set
# and every palette retunes. refresh.sh mirrors the same set.
status_indicators = "dots"

# Each space is one block: name, branch, then one line per pane with what it is
# running. The title and a1..a6 tokens come from space-tokens/refresh.sh; rows
# with no value disappear, so a block is only as tall as it has content. Drag
# the sidebar's section divider to the bottom to starve the agents panel.
#
# $title stands in for the built-in workspace token, which renders a label that
# is a bare basename until someone changes it. It is the repo name, joined to the
# label by refresh.sh when the label is one somebody chose, and the branch row
# under it says which checkout. Joining there rather than giving the label its
# own token keeps the separator this script's to pick and costs no second column.
#
# Color says what the pane wants from you, and a style belongs to a whole token,
# so each thing a line can be needs its own. The three that carry a color are the
# three state_icon itself colors, so a pane line reads the same way as the space
# row above it: blocked goes loud and bold, working takes the busy color, and done
# takes the calm one. Idle is the only state left in the ordinary foreground,
# which is what makes a finished space look finished. An idle agent with
# background work still running counts as working rather than done, because the
# calm color is a claim there is nothing left to wait for.
#
# Never two tokens with a value on the same row: Herdr joins the ones that render
# with " · ", so a glyph and its text side by side come out as "● · title". That
# is why the color goes on the whole line and not on the glyph alone, and why
# refresh.sh sets exactly one token per slot and clears the others. A row holds
# every state a slot can be in, which is safe only because at most one is set.
#
# Herdr allows 16 rows here and this uses 9, so raising `slots` in refresh.sh
# costs one row each up to 13.
#
# @hot, @working and @done are placeholders tt fills in from the theme's palette.
# See tt/THEME_GUIDE.md for why they are placeholders and not theme color names.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "$title", bold = true }],
  ["branch", "git_status"],
  [{ token = "$a1_blocked", bold = true, fg = "@hot" }, { token = "$a1_working", fg = "@working" }, { token = "$a1_done", fg = "@done" }, "$a1"],
  [{ token = "$a2_blocked", bold = true, fg = "@hot" }, { token = "$a2_working", fg = "@working" }, { token = "$a2_done", fg = "@done" }, "$a2"],
  [{ token = "$a3_blocked", bold = true, fg = "@hot" }, { token = "$a3_working", fg = "@working" }, { token = "$a3_done", fg = "@done" }, "$a3"],
  [{ token = "$a4_blocked", bold = true, fg = "@hot" }, { token = "$a4_working", fg = "@working" }, { token = "$a4_done", fg = "@done" }, "$a4"],
  [{ token = "$a5_blocked", bold = true, fg = "@hot" }, { token = "$a5_working", fg = "@working" }, { token = "$a5_done", fg = "@done" }, "$a5"],
  [{ token = "$a6_blocked", bold = true, fg = "@hot" }, { token = "$a6_working", fg = "@working" }, { token = "$a6_done", fg = "@done" }, "$a6"],
  [{ token = "$more_blocked", bold = true, fg = "@hot" }, "$more"],
]

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true
