onboarding = false

[theme]
name = "terminal"

# tt concatenates this file with tt/themes/<name>/herdr.toml to produce
# config.toml, which is what Herdr reads, so edit this one. The theme fragment
# owns `[theme.custom]`, because no single overlay0 gray is recessive on both
# paper and ink backgrounds.

[terminal]
new_cwd = "follow"

[update]
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+space"

help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
open_notification_target = ""
edit_scrollback = "prefix+e"

workspace_picker = "prefix+w"
previous_workspace = "alt+k"
next_workspace = "alt+j"
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+q"

new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "alt+h"
next_tab = "alt+l"

move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+l"

switch_tab = "alt+1..9"
close_tab = "prefix+q"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+f"
resize_mode = "prefix+r"

resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = "$HOME/.local/bin/herdr-move-workspace up"
description = "move workspace up"

[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = "$HOME/.local/bin/herdr-move-workspace down"
description = "move workspace down"

[[keys.command]]
key = "alt+n"
type = "plugin_action"
command = "to4iki.unread-jump.next"
description = "focus next agent waiting"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "$HOME/.local/bin/herdr-toggle-split"
description = "toggle split direction"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "reobin.close-other-panes.close-others"

[[keys.command]]
key = "alt+s"
type = "shell"
command = "$HOME/.local/bin/herdr-sidetrack"
description = "sidetrack this conversation"

# A pane garbled by a fullscreen toggle survives claude's own repaints, /resume
# and ctrl+l alike, so clearing it takes a new process.
[[keys.command]]
key = "alt+c"
type = "shell"
command = "$HOME/.local/bin/herdr-restart-agent"
description = "restart claude on the same session"

[[keys.command]]
key = "alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "review agent changes"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "$SHELL"
width = "80%"
height = "80%"
description = "floating pane"

[ui]
mouse_capture = true

# A wheel notch is the only scroll Herdr sizes from config. The karabiner rule
# behind alt+u sends notches, so this is what makes that chord land on roughly
# half a screen, at the cost of a coarser trackpad.
mouse_scroll_lines = 8
confirm_close = false
prompt_new_tab_name = false

# The prompt lands before there is anything to name, so what gets typed is a
# placeholder. The title and branch rows below already say which repo and
# checkout; a space that earns a name gets one later from rename_workspace.
prompt_new_workspace_name = false

# Agent and command lines need the room; 36 is also the default max width.
sidebar_width = 36

pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true

pane_scrollbars = false

hide_tab_bar_when_single_tab = true

agent_panel_sort = "spaces"

# The symbols set marks working with U+25D0, which JetBrains Mono lacks, so it
# falls back to Menlo and draws a size larger than every glyph beside it. Dots
# stay in the one font. refresh.sh mirrors the same set.
status_indicators = "dots"

# Each space is one block: title, branch, then one line per pane. The $title and
# a1..a6 tokens come from space-tokens/refresh.sh; rows with no value disappear,
# so a block is only as tall as it has content.
#
# A style belongs to a whole token, so every state a line can be needs its own
# token. Blocked, working and done carry the three state colors, so a pane line
# reads like the space row above it. Idle shares the done token: a seen-and-
# finished agent is still finished, so only its glyph drops from ● to ○.
#
# `$aN` is an agent Herdr reports no status for and `$aN_pane` a pane running no
# agent. Neither claims a state, so both stay in the plain foreground.
#
# Never two tokens with a value on the same row: Herdr joins the ones that render
# with " · ", so a glyph and its text come out as "● · title". refresh.sh sets
# exactly one token per slot and clears the others, which is the only reason a
# row can list every state a slot can be in.
#
# Herdr allows 16 rows and this uses 9, so raising `slots` in refresh.sh costs
# one row each up to 13. A report carries at most 16 tokens and a slot owns five,
# which is what `batch` in refresh.sh keeps a group under.
#
# @hot, @working, @done and @idle are placeholders tt fills from the theme's own
# `[theme.custom]` tokens or its ANSI palette; see tt/THEME_GUIDE.md. @idle is
# the one that is not a state color and resolves to the ordinary foreground.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "$title", bold = true }],
  ["branch", "git_status"],
  [{ token = "$a1_blocked", bold = true, fg = "@hot" }, { token = "$a1_working", fg = "@working" }, { token = "$a1_done", fg = "@done" }, { token = "$a1", fg = "@idle" }, "$a1_pane"],
  [{ token = "$a2_blocked", bold = true, fg = "@hot" }, { token = "$a2_working", fg = "@working" }, { token = "$a2_done", fg = "@done" }, { token = "$a2", fg = "@idle" }, "$a2_pane"],
  [{ token = "$a3_blocked", bold = true, fg = "@hot" }, { token = "$a3_working", fg = "@working" }, { token = "$a3_done", fg = "@done" }, { token = "$a3", fg = "@idle" }, "$a3_pane"],
  [{ token = "$a4_blocked", bold = true, fg = "@hot" }, { token = "$a4_working", fg = "@working" }, { token = "$a4_done", fg = "@done" }, { token = "$a4", fg = "@idle" }, "$a4_pane"],
  [{ token = "$a5_blocked", bold = true, fg = "@hot" }, { token = "$a5_working", fg = "@working" }, { token = "$a5_done", fg = "@done" }, { token = "$a5", fg = "@idle" }, "$a5_pane"],
  [{ token = "$a6_blocked", bold = true, fg = "@hot" }, { token = "$a6_working", fg = "@working" }, { token = "$a6_done", fg = "@done" }, { token = "$a6", fg = "@idle" }, "$a6_pane"],
  [{ token = "$more_blocked", bold = true, fg = "@hot" }, "$more"],
]

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true
