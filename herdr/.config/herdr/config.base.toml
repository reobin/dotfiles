onboarding = false

[theme]
name = "terminal"

# tt builds config.toml from this + tt/themes/<name>/herdr.toml. edit this one.
# theme fragment owns `[theme.custom]`.

[terminal]
new_cwd = "follow"

[update]
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+space"

help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
open_notification_target = ""
edit_scrollback = "prefix+e"

workspace_picker = "prefix+w"
# every pane grouped by space, live; one key, no prefix, like the alt+j/k moves.
goto = "alt+g"
previous_workspace = "alt+k"
next_workspace = "alt+j"
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+q"

new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "alt+h"
next_tab = "alt+l"

move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+l"

switch_tab = "alt+1..9"
close_tab = "prefix+q"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "alt+f"
resize_mode = "prefix+r"

resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = "$HOME/.local/bin/herdr-move-workspace up"
description = "move workspace up"

[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = "$HOME/.local/bin/herdr-move-workspace down"
description = "move workspace down"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-togglesplit.toggle"
description = "toggle split direction"

[[keys.command]]
key = ["prefix+o", "alt+o"]
type = "plugin_action"
command = "herdr-close-other-panes.close-others"

[[keys.command]]
key = "alt+s"
type = "shell"
command = "$HOME/.local/bin/herdr-sidetrack"
description = "sidetrack this conversation"

# repaint won't fix fullscreen garble; restart needs a new process.
[[keys.command]]
key = "alt+c"
type = "shell"
command = "$HOME/.local/bin/herdr-restart-agent"
description = "restart claude on the same session"

[[keys.command]]
key = "alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "review agent changes"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "$SHELL"
width = "80%"
height = "80%"
description = "floating pane"

[ui]
mouse_capture = true

confirm_close = false
prompt_new_tab_name = false

# prompt fires before there's anything to name; rename later.
prompt_new_workspace_name = false

# callsign, tab and title on one row. 36 is only Herdr's default max, not a cap.
sidebar_width = 46
sidebar_max_width = 46

pane_borders = "always"
pane_outer_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true

pane_scrollbars = false

hide_tab_bar_when_single_tab = true

# only Ghostty tab readout when Herdr tab bar hides; empty renders as nothing.
window_title = "{workspace}: {terminal_title}"

# zoom pill only; clock would duplicate shell prompt.
tab_bar_right = [{ type = "zoom" }]

agent_panel_sort = "spaces"

# symbols glyph mis-sizes in JetBrains Mono fallback; dots stays in one font.
status_indicators = "dots"

[ui.sidebar]
layout = "unified" # from reobin/herdr fork

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true
# signal bloom pack (CC0, WorksOnMyVM/herdr-sounds), relative to this config's directory.
done_path = "sounds/done.mp3"
request_path = "sounds/request.mp3"

[session]
resume_agents_on_restore = true

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-link-hints.hints"
description = "hint links in focused pane"
