onboarding = false

[theme]
name = "terminal"

[theme.custom]
# accent = "cyan"
overlay0 = "darkgray"
# mauve = "cyan"
# green = "green"
# yellow = "yellow"
# red = "red"
# peach = "yellow"

[terminal]
new_cwd = "follow"

[update]
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+space"

help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
open_notification_target = ""
edit_scrollback = "prefix+e"

workspace_picker = "prefix+w"
previous_workspace = "alt+k"
next_workspace = "alt+j"
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+q"

new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "alt+h"
next_tab = "alt+l"
switch_tab = "alt+1..9"
close_tab = "prefix+q"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+f"
resize_mode = "prefix+r"

navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "$HOME/dotfiles/herdr/.local/bin/herdr-toggle-split"
description = "toggle split direction"

[[keys.command]]
key = "prefix+o"
type = "shell"
command = "$HOME/dotfiles/herdr/.local/bin/herdr-close-other-panes"
description = "close other panes"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = "$SHELL"
width = "80%"
height = "80%"
description = "floating pane"

[ui]
mouse_capture = true
confirm_close = false
prompt_new_tab_name = false

# Agent and command lines need the room; 36 is also the default max width.
sidebar_width = 36

pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true

pane_scrollbars = false

hide_tab_bar_when_single_tab = true

agent_panel_sort = "spaces"

# Each space is one block: name, branch, then a line per pane with what it is
# running. The title and a1..a4 tokens come from space-tokens/refresh.sh; rows
# with no value disappear, so a block is only as tall as it has content. Drag
# the sidebar's section divider to the bottom to starve the agents panel.
#
# $title stands in for the built-in workspace token because labels are bare
# basenames; it names the repo instead, and the branch row says which checkout.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "$title", bold = true }],
  ["branch", "git_status"],
  [{ token = "$a1_hot", bold = true }],
  ["$a1"],
  ["$a1_title"],
  [{ token = "$a2_hot", bold = true }],
  ["$a2"],
  ["$a2_title"],
  [{ token = "$a3_hot", bold = true }],
  ["$a3"],
  ["$a3_title"],
  [{ token = "$a4_hot", bold = true }],
  ["$a4"],
  ["$a4_title"],
  ["$more"],
]

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = false
